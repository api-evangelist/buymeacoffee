- aid: buymeacoffee:buymeacoffee-webhooks-api
  name: Buy Me a Coffee Webhooks
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://help.buymeacoffee.com/en/articles/15743173-how-to-setup-and-use-buy-me-a-coffee-webhooks
  baseURL: https://developers.buymeacoffee.com/api/v1
  properties:
  - url: >-
      https://help.buymeacoffee.com/en/articles/15743173-how-to-setup-and-use-buy-me-a-coffee-webhooks
    type: Documentation
  description: >-
    Server-push HTTP webhooks configured in the dashboard (Integrations - New webhook). Buy Me a Coffee
    POSTs a JSON event envelope to a subscriber URL for donation, membership / recurring-donation, extra
    purchase, commission, and wishlist events. Each request is signed with an HMAC-SHA256 signature in
    the x-signature-sha256 header. This is server-to-endpoint HTTP, not a WebSocket.
